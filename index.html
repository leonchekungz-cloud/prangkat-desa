<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Perangkat Desa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .camera-container { position: relative; overflow: hidden; border-radius: 0.75rem; background: #000; }
        #video-preview { width: 100%; object-fit: cover; transform: scaleX(-1); }
        #canvas-capture { display: none; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Desa Pintar</h1>
                    <p class="text-xs text-emerald-200">Portal Absensi Perangkat Desa</p>
                </div>
            </div>
            <div id="connection-status" class="flex items-center gap-2 text-xs bg-emerald-800 px-2 py-1 rounded-full">
                <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse" id="status-dot"></span>
                <span id="status-text">Menghubungkan...</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-6 grid md:grid-cols-2 gap-6">
        
        <!-- Form Absensi -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col h-fit">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Form Kehadiran</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Nama Lengkap</label>
                    <input type="text" id="input-name" placeholder="Contoh: Budi Santoso" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Jabatan</label>
                    <select id="input-role" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all bg-white">
                        <option value="">-- Pilih Jabatan --</option>
                        <option value="Kepala Desa">Kepala Desa</option>
                        <option value="Sekretaris Desa">Sekretaris Desa (Sekdes)</option>
                        <option value="Kaur Keuangan">Kaur Keuangan</option>
                        <option value="Kaur Umum & Perencanaan">Kaur Umum & Perencanaan</option>
                        <option value="Kasi Pemerintahan">Kasi Pemerintahan</option>
                        <option value="Kasi Kesejahteraan">Kasi Kesejahteraan</option>
                        <option value="Kasi Pelayanan">Kasi Pelayanan</option>
                        <option value="Kepala Dusun">Kepala Dusun</option>
                        <option value="Staf Desa">Staf Desa</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Foto Selfie Kehadiran</label>
                    <div class="camera-container aspect-[4/3] bg-gray-200 flex items-center justify-center relative">
                        <video id="video-preview" autoplay playsinline class="hidden"></video>
                        <img id="photo-result" class="hidden w-full h-full object-cover transform scale-x-[-1]" />
                        
                        <div id="camera-placeholder" class="text-center text-gray-500 flex flex-col items-center">
                            <svg class="w-10 h-10 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            <p class="text-sm">Kamera tidak aktif</p>
                        </div>

                        <!-- Action Buttons Overlay -->
                        <div class="absolute bottom-3 left-0 w-full flex justify-center gap-2 px-3">
                            <button id="btn-start-camera" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm py-1.5 px-4 rounded-full shadow transition-colors">Nyalakan Kamera</button>
                            <button id="btn-capture" class="hidden bg-white text-emerald-700 hover:bg-gray-100 font-medium text-sm py-1.5 px-4 rounded-full shadow transition-colors flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                Ambil Foto
                            </button>
                            <button id="btn-retake" class="hidden bg-gray-800/80 hover:bg-gray-900 text-white text-sm py-1.5 px-4 rounded-full shadow transition-colors backdrop-blur-sm">Ulangi</button>
                        </div>
                    </div>
                    <canvas id="canvas-capture"></canvas>
                </div>

                <button id="btn-submit" disabled class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-3 rounded-lg shadow transition-colors flex items-center justify-center gap-2 mt-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Kirim Absensi Sekarang
                </button>
            </div>
        </section>

        <!-- Riwayat Absensi -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[600px]">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 class="text-lg font-semibold text-gray-700">Riwayat Kehadiran</h2>
                <span class="text-xs text-gray-500 font-medium px-2 py-1 bg-gray-200 rounded-md">Hari Ini</span>
            </div>
            
            <div id="attendance-list" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/50">
                <!-- Data will be loaded here -->
                <div class="flex flex-col items-center justify-center h-full text-gray-400">
                    <svg class="w-10 h-10 mb-2 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <p class="text-sm">Memuat data...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Alert (Menggantikan alert bawaan browser) -->
    <div id="modal-alert" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300">
            <div id="modal-icon" class="w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto"></div>
            <h3 id="modal-title" class="text-lg font-bold text-center text-gray-800 mb-2">Pemberitahuan</h3>
            <p id="modal-message" class="text-sm text-gray-600 text-center mb-6">Pesan di sini.</p>
            <button onclick="closeModal()" class="w-full bg-gray-900 hover:bg-black text-white font-medium py-2 rounded-lg transition-colors">Tutup</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (from environment variables)
        let firebaseConfig = {};
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        } catch (e) {
            console.warn("Using default demo config");
            // Placeholder if environment is missing, usually overridden by platform
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // App settings
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'desa-pintar-absensi';
        // Path koleksi Firestore (Harus mengikuti strict path rules)
        const collectionPath = `artifacts/${appId}/public/data/attendance`;
        let currentUser = null;

        // UI Elements
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const attendanceList = document.getElementById('attendance-list');
        const btnSubmit = document.getElementById('btn-submit');
        
        window.showModal = (title, message, type = 'info') => {
            const modal = document.getElementById('modal-alert');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
            const modalIcon = document.getElementById('modal-icon');
            
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            if (type === 'error') {
                modalIcon.className = 'w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto bg-red-100 text-red-600';
                modalIcon.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else if (type === 'success') {
                modalIcon.className = 'w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto bg-emerald-100 text-emerald-600';
                modalIcon.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else {
                modalIcon.className = 'w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto bg-blue-100 text-blue-600';
                modalIcon.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }

            modal.classList.remove('hidden');
            // Small timeout to allow display:flex to apply before animating opacity
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        };

        window.closeModal = () => {
            const modal = document.getElementById('modal-alert');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;
                
                statusText.textContent = "Terhubung";
                statusDot.classList.replace('bg-yellow-400', 'bg-emerald-400');
                statusDot.classList.remove('animate-pulse');
                
                // Setelah auth berhasil, load data
                loadAttendanceData();
                
            } catch (error) {
                console.error("Auth error:", error);
                statusText.textContent = "Gagal Konek";
                statusDot.classList.replace('bg-yellow-400', 'bg-red-500');
                showModal('Koneksi Gagal', 'Gagal terhubung ke server database.', 'error');
            }
        }

        function loadAttendanceData() {
            if (!currentUser) return;

            const attCollection = collection(db, collectionPath);
            
            // Aturan Firestore: Jangan pakai query kompleks seperti orderBy di sini
            // Kita fetch semua, lalu sorting di memori (JavaScript)
            onSnapshot(attCollection, (snapshot) => {
                const records = [];
                snapshot.forEach((doc) => {
                    records.push({ id: doc.id, ...doc.data() });
                });

                // Sort descending berdasarkan timestamp (terbaru di atas)
                records.sort((a, b) => b.timestamp - a.timestamp);
                renderAttendance(records);

            }, (error) => {
                console.error("Error fetching data: ", error);
                attendanceList.innerHTML = `<div class="p-4 text-center text-red-500 text-sm">Gagal memuat data.</div>`;
            });
        }

        function renderAttendance(records) {
            if (records.length === 0) {
                attendanceList.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 p-8 text-center">
                        <svg class="w-12 h-12 mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <p class="text-sm">Belum ada data absensi hari ini.</p>
                    </div>`;
                return;
            }

            attendanceList.innerHTML = '';
            
            // Format hari ini untuk memisahkan data hari ini vs sebelumnya jika diperlukan
            const todayStr = new Date().toLocaleDateString('id-ID');

            records.forEach(record => {
                const dateObj = new Date(record.timestamp);
                const timeStr = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                
                // Card item
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-lg border border-gray-100 shadow-sm flex items-start gap-3 hover:shadow-md transition-shadow";
                
                card.innerHTML = `
                    <div class="w-12 h-12 rounded-full bg-gray-200 overflow-hidden flex-shrink-0 border-2 border-emerald-100">
                        ${record.photo ? `<img src="${record.photo}" class="w-full h-full object-cover transform scale-x-[-1]" alt="Selfie">` : `<svg class="w-full h-full text-gray-400 p-2" fill="currentColor" viewBox="0 0 24 24"><path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" /></svg>`}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-gray-800 text-sm truncate">${record.name}</h4>
                        <p class="text-xs text-gray-500 truncate">${record.role}</p>
                        ${record.location ? `
                        <a href="https://maps.google.com/?q=${record.location.lat},${record.location.lng}" target="_blank" class="text-[10px] text-blue-500 hover:underline flex items-center gap-1 mt-1 truncate">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            Lokasi Tersimpan
                        </a>` : ''}
                    </div>
                    <div class="text-right">
                        <span class="block text-emerald-600 font-bold text-sm">${timeStr}</span>
                        <span class="block text-[10px] text-gray-400">${dateStr}</span>
                    </div>
                `;
                attendanceList.appendChild(card);
            });
        }

        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('canvas-capture');
        const photoResult = document.getElementById('photo-result');
        const btnStartCam = document.getElementById('btn-start-camera');
        const btnCapture = document.getElementById('btn-capture');
        const btnRetake = document.getElementById('btn-retake');
        const cameraPlaceholder = document.getElementById('camera-placeholder');
        
        let stream = null;
        let capturedPhotoBase64 = null;

        btnStartCam.addEventListener('click', async () => {
            try {
                // Meminta akses kamera (kamera depan jika di HP)
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                
                // Ubah UI
                video.classList.remove('hidden');
                cameraPlaceholder.classList.add('hidden');
                btnStartCam.classList.add('hidden');
                btnCapture.classList.remove('hidden');
                btnCapture.classList.add('flex');

            } catch (err) {
                console.error("Camera access denied or error:", err);
                showModal('Akses Kamera', 'Gagal mengakses kamera. Pastikan browser memiliki izin untuk menggunakan kamera.', 'error');
            }
        });

        btnCapture.addEventListener('click', () => {
            if (!stream) return;
            
            // Set canvas size (kompresi resolusi agar base64 tidak terlalu besar untuk Firestore)
            // Resolusi 400x300 sudah cukup baik untuk thumbnail selfie presensi
            canvas.width = 400;
            canvas.height = 300;
            
            const context = canvas.getContext('2d');
            // Draw video frame to canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert to Base64 (JPEG format with 0.7 quality untuk kompresi)
            capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
            
            // Tampilkan foto hasil dan matikan sementara video
            photoResult.src = capturedPhotoBase64;
            photoResult.classList.remove('hidden');
            video.classList.add('hidden');
            
            // Ubah tombol
            btnCapture.classList.add('hidden');
            btnCapture.classList.remove('flex');
            btnRetake.classList.remove('hidden');

            // Cek form validasi untuk tombol submit
            validateForm();
        });

        btnRetake.addEventListener('click', () => {
            capturedPhotoBase64 = null;
            photoResult.classList.add('hidden');
            video.classList.remove('hidden');
            
            btnRetake.classList.add('hidden');
            btnCapture.classList.remove('hidden');
            btnCapture.classList.add('flex');
            
            validateForm();
        });

        const inputName = document.getElementById('input-name');
        const inputRole = document.getElementById('input-role');

        function validateForm() {
            const name = inputName.value.trim();
            const role = inputRole.value;
            
            if (name && role && capturedPhotoBase64 && currentUser) {
                btnSubmit.removeAttribute('disabled');
            } else {
                btnSubmit.setAttribute('disabled', 'true');
            }
        }

        inputName.addEventListener('input', validateForm);
        inputRole.addEventListener('change', validateForm);

        // Mendapatkan lokasi saat ini
        function getCurrentLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject("Geolocation tidak didukung oleh browser ini.");
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            });
                        },
                        (error) => {
                            reject(error.message);
                        },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                }
            });
        }

        btnSubmit.addEventListener('click', async () => {
            if (!currentUser) {
                showModal('Error', 'Anda belum terhubung ke database. Tunggu sebentar.', 'error');
                return;
            }

            const name = inputName.value.trim();
            const role = inputRole.value;

            // UI Loading state
            const originalBtnText = btnSubmit.innerHTML;
            btnSubmit.setAttribute('disabled', 'true');
            btnSubmit.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Memproses...`;

            try {
                // Ambil lokasi perangkat opsional
                let userLocation = null;
                try {
                    userLocation = await getCurrentLocation();
                } catch (locErr) {
                    console.log("Location fetch failed, continuing without location:", locErr);
                    // Lanjut tanpa lokasi jika gagal/ditolak izinnya
                }

                // Data yang akan disimpan ke Firestore
                const attendanceData = {
                    userId: currentUser.uid,
                    name: name,
                    role: role,
                    photo: capturedPhotoBase64, // Disimpan sebagai string base64
                    location: userLocation,
                    timestamp: Date.now()
                };

                // Insert to Firebase
                const attCollection = collection(db, collectionPath);
                await addDoc(attCollection, attendanceData);

                // Reset Form
                inputName.value = '';
                inputRole.value = '';
                btnRetake.click(); // Reset camera
                showModal('Berhasil', 'Absensi kehadiran berhasil disimpan!', 'success');

            } catch (error) {
                console.error("Error saving attendance:", error);
                showModal('Gagal', 'Terjadi kesalahan saat menyimpan data. Coba lagi.', 'error');
            } finally {
                // Restore button
                btnSubmit.innerHTML = originalBtnText;
                validateForm(); // Re-validate to set correct disabled state
            }
        });

        // Hentikan kamera jika tab ditutup/pindah
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });

        // Initialize Authentication on load
        initAuth();

    </script>
</body>
</html>
